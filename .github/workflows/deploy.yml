name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: java123333/myapp:latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}
      
      - name: Deploy to server via SSH
        env:
          ENCODED_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$ENCODED_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            cd /opt/myapp &&
            docker pull ${{ env.DOCKER_IMAGE }} &&
            docker compose down || true &&
            docker compose up -d &&
            echo 'Deployment completed!' &&
            docker ps
          "
